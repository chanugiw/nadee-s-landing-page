<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nsGradient" x1="70" y1="60" x2="520" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4A7C0"/>
      <stop offset="0.3" stop-color="#D92E70"/>
      <stop offset="0.62" stop-color="#B4004F"/>
      <stop offset="1" stop-color="#7B003A"/>
    </linearGradient>
    <linearGradient id="nsHighlight" x1="150" y1="110" x2="410" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFDDEB" stop-opacity="0.8"/>
