      opacity="0.98"
    >N</text>

    <text
      x="270"
      y="448"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="430"
      font-weight="700"
      letter-spacing="-12"
      fill="url(#nsGradient)"
      opacity="0.98"
    >S</text>
  </g>
</svg>
